<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlowM" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#0f0e0d" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Lane Boards Sheen -->
    <linearGradient id="laneSheenM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="20%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Ball Shine -->
    <radialGradient id="ballShineM" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#b45309" />
      <stop offset="90%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#291205" />
    </radialGradient>

    <!-- Pin Gradients -->
    <linearGradient id="pinGradLeftM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="pinGradRightM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="pinShadowM" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Full-Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGlowM)" />

  <!-- Safe Zone Scaling (center content fits within 80% safe circle) -->
  <g transform="translate(25.6, 25.6) scale(0.9)">
    <!-- 1. BOWLING LANE -->
    <g opacity="0.95">
      <polygon points="120,490 392,490 326,90 186,90" fill="url(#laneSheenM)" />
      <line x1="160" y1="490" x2="206" y2="90" stroke="#451a03" stroke-width="2" opacity="0.6" />
      <line x1="200" y1="490" x2="226" y2="90" stroke="#451a03" stroke-width="2" opacity="0.6" />
      <line x1="256" y1="490" x2="256" y2="90" stroke="#fbbf24" stroke-width="2.5" opacity="0.5" stroke-dasharray="8 6" />
      <line x1="312" y1="490" x2="286" y2="90" stroke="#451a03" stroke-width="2" opacity="0.6" />
      <line x1="352" y1="490" x2="306" y2="90" stroke="#451a03" stroke-width="2" opacity="0.6" />

      <polygon points="256,230 246,252 266,252" fill="#f59e0b" opacity="0.85" />
      <polygon points="220,250 212,270 228,270" fill="#d97706" opacity="0.75" />
      <polygon points="292,250 284,270 300,270" fill="#d97706" opacity="0.75" />

      <polygon points="98,490 120,490 186,90 172,90" fill="#171717" opacity="0.7" />
      <polygon points="392,490 414,490 340,90 326,90" fill="#171717" opacity="0.7" />

      <line x1="110" y1="465" x2="402" y2="465" stroke="#ef4444" stroke-width="4.5" opacity="0.9" />
    </g>

    <!-- 2. TWO BOWLING PINS -->
    <g filter="url(#pinShadowM)" transform="translate(290, 80) scale(0.72)">
      <path d="M 50 10 
               C 42 10, 36 18, 36 28
               C 36 38, 42 46, 44 60
               C 46 76, 38 88, 30 110
               C 20 135, 14 165, 14 195
               C 14 225, 24 240, 50 240
               C 76 240, 86 225, 86 195
               C 86 165, 80 135, 70 110
               C 62 88, 54 76, 56 60
               C 58 46, 64 38, 64 28
               C 64 18, 58 10, 50 10 Z"
            fill="url(#pinGradRightM)" stroke="#94a3b8" stroke-width="2" />
      <path d="M 42 48 Q 50 51 58 48 L 57 54 Q 50 57 43 54 Z" fill="#dc2626" />
      <path d="M 40 60 Q 50 63 60 60 L 59 66 Q 50 69 41 66 Z" fill="#dc2626" />
      <ellipse cx="48" cy="22" rx="4" ry="6" fill="#ffffff" opacity="0.7" />
    </g>

    <g filter="url(#pinShadowM)" transform="translate(165, 70) scale(0.82)">
      <path d="M 50 10 
               C 42 10, 36 18, 36 28
               C 36 38, 42 46, 44 60
               C 46 76, 38 88, 30 110
               C 20 135, 14 165, 14 195
               C 14 225, 24 240, 50 240
               C 76 240, 86 225, 86 195
               C 86 165, 80 135, 70 110
               C 62 88, 54 76, 56 60
               C 58 46, 64 38, 64 28
               C 64 18, 58 10, 50 10 Z"
            fill="url(#pinGradLeftM)" stroke="#cbd5e1" stroke-width="2.5" />
      <path d="M 42 48 Q 50 51 58 48 L 57 54 Q 50 57 43 54 Z" fill="#dc2626" />
      <path d="M 40 60 Q 50 63 60 60 L 59 66 Q 50 69 41 66 Z" fill="#dc2626" />
      <ellipse cx="47" cy="22" rx="5" ry="7" fill="#ffffff" opacity="0.8" />
      <path d="M 28 150 Q 24 180 32 205" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- 3. BOWLING BALL -->
    <g filter="url(#shadowM)">
      <circle cx="270" cy="340" r="115" fill="url(#ballShineM)" stroke="#451a03" stroke-width="3" />
      <path d="M 190 280 A 95 95 0 0 1 290 235" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55" />
      <path d="M 210 395 Q 260 435 340 390 Q 380 360 365 300" fill="none" stroke="#fde047" stroke-width="9" stroke-linecap="round" opacity="0.35" />
      <path d="M 185 340 Q 235 375 285 340" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" opacity="0.3" />

      <ellipse cx="245" cy="305" rx="14" ry="16" fill="#1c1917" stroke="#451a03" stroke-width="3" />
      <ellipse cx="242" cy="302" rx="11" ry="13" fill="#0c0a09" />
      <ellipse cx="285" cy="305" rx="14" ry="16" fill="#1c1917" stroke="#451a03" stroke-width="3" />
      <ellipse cx="282" cy="302" rx="11" ry="13" fill="#0c0a09" />
      <ellipse cx="265" cy="365" rx="18" ry="20" fill="#1c1917" stroke="#451a03" stroke-width="3.5" />
      <ellipse cx="261" cy="361" rx="14" ry="16" fill="#0c0a09" />
    </g>
  </g>
</svg>
