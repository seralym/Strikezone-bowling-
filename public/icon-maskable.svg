<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlowM" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <radialGradient id="ballShineM" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#291205" />
    </radialGradient>
    <radialGradient id="holeDepthM" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background for maskable squircle/circle cropping -->
  <rect width="512" height="512" fill="url(#bgGlowM)" />

  <!-- Safe Zone Bowling Ball (inside central 80%) -->
  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)">
    <!-- Ball Body -->
    <circle cx="256" cy="256" r="176" fill="url(#ballShineM)" />

    <!-- Specular highlight streak -->
    <path d="M 130 180 A 150 150 0 0 1 270 110" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.45" />

    <!-- Swirl overlay detail -->
    <path d="M 160 330 Q 230 380 340 330 Q 410 290 380 200" fill="none" stroke="#fbbf24" stroke-width="16" stroke-linecap="round" opacity="0.3" />

    <!-- Finger Holes -->
    <ellipse cx="225" cy="205" rx="20" ry="22" fill="url(#holeDepthM)" stroke="#451a03" stroke-width="4" />
    <ellipse cx="285" cy="205" rx="20" ry="22" fill="url(#holeDepthM)" stroke="#451a03" stroke-width="4" />
    <ellipse cx="255" cy="295" rx="26" ry="29" fill="url(#holeDepthM)" stroke="#451a03" stroke-width="5" />
  </g>
</svg>
