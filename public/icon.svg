<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <radialGradient id="ballShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#291205" />
    </radialGradient>
    <radialGradient id="holeDepth" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background rounded app icon frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#27272a" stroke-width="3" />

  <!-- Center Bowling Ball with shadow -->
  <g filter="url(#shadow)">
    <!-- Ball Body -->
    <circle cx="256" cy="256" r="176" fill="url(#ballShine)" />

    <!-- Specular highlight streak -->
    <path d="M 130 180 A 150 150 0 0 1 270 110" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.45" />

    <!-- Swirl overlay detail -->
    <path d="M 160 330 Q 230 380 340 330 Q 410 290 380 200" fill="none" stroke="#fbbf24" stroke-width="16" stroke-linecap="round" opacity="0.3" />

    <!-- Finger Holes -->
    <!-- Left hole -->
    <ellipse cx="225" cy="205" rx="20" ry="22" fill="url(#holeDepth)" stroke="#451a03" stroke-width="4" />
    <!-- Right hole -->
    <ellipse cx="285" cy="205" rx="20" ry="22" fill="url(#holeDepth)" stroke="#451a03" stroke-width="4" />
    <!-- Thumb hole -->
    <ellipse cx="255" cy="295" rx="26" ry="29" fill="url(#holeDepth)" stroke="#451a03" stroke-width="5" />
  </g>

  <!-- Golden Crown / Strike Sparkle Accent -->
  <circle cx="360" cy="150" r="10" fill="#fef08a" opacity="0.9" />
  <path d="M 360 130 L 360 170 M 340 150 L 380 150" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.9" />
</svg>
